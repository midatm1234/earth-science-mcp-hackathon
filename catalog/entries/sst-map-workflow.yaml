id: sst-map-workflow
type: agent-skill
origin: event
title: Map and animate recent sea surface temperature
scientific_purpose: >-
  Guides an assistant to fetch the newest 10 days of MUR sea surface temperature for a region, draw a Cartopy map and make a GIF animation, using only the sst-latest tools and stating that the result is a gridded analysis, not station data.
team: test
authors:
  - team test
version: 0.1.0
