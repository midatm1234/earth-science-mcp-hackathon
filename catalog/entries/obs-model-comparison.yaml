# Catalog entry for an agent skill. Field reference: catalog/README.md
id: obs-model-comparison
type: agent-skill
origin: event
title: Observation-model comparison workflow
scientific_purpose: >-
  Guide an agent through selecting observation and model inputs, checking units,
  time-stamp conventions, missing data and provenance, calling the comparison
  tool, and explaining bias and RMSE with limitations.
team: organizers
authors:
  - Event organizers (prepared for Hugo Kyo Lee)
version: 0.1.0
source:
  path: skills/obs-model-comparison
  ref: TBD-at-freeze
license: Apache-2.0
attribution: Original text.
data:
  classes: [synthetic]
  volume: none (uses the server's data)
  provenance: servers/obs-model-starter/data/README.md
credentials: none
network: none
dependencies:
  python: ">=3.11,<3.15"
  packages: []
requires_mcp_tools:
  - obs-model-starter/list_datasets
  - obs-model-starter/describe_dataset
  - obs-model-starter/compare_model_to_obs
tools: []
transports: []
install: uv run python scripts/install_skills.py obs-model-comparison
run:
  copilot: /obs-model-comparison Compare model A with the station observations at SYN-VALLEY.
  claude-code: /obs-model-comparison Compare model A with the station observations at SYN-VALLEY.
  codex: $obs-model-comparison Compare model A with the station observations at SYN-VALLEY.
runtime: about 1 minute of agent time
example:
  prompt: How well does model run B match the station observations at the mountain site in 2021?
  expected_output: >-
    One-sentence result, table of n pairs / mean bias / RMSE in degC, unit conversion and
    excluded months, provenance stating the data are synthetic, limitations, tool trace.
tests:
  command: uv run python scripts/verify_agent_workflow.py --client <claude|copilot|codex> --only explicit --only natural --only negative
  evidence: docs/validation-report.md
status:
  review: accepted
  local_verification:
    result: partial
    date: "2026-10-30"
    by: organizer preparation
    platform: >-
      macOS 27.0.1 arm64; GitHub Copilot CLI 1.0.105; Codex CLI 0.164.0-alpha.11.1 (bundled in the
      OpenAI VS Code extension 26.51021.22027); Claude Code 2.1.185
    evidence: >-
      docs/validation-report.md - mcp/explicit/natural/negative pass with Copilot and Codex; Claude Code
      connects the servers and lists the skill, model-driven checks pending (no reachable Claude account).
  peer_testing: []
  hosting:
    status: not-applicable
    endpoint: none
